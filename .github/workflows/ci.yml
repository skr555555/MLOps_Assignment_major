name: CI - train and test

# Trigger only on pushes to the dev branch
on:
  push:
    branches:
      - dev

jobs:
  check_working_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (pip, pinned numpy first)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # install numpy first to match C-API for compiled wheels
          python -m pip install "numpy==1.24.3"
          # now install the rest from requirements (which includes scikit-learn pinned)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

