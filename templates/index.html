<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Olivetti Faces - Prediction Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background:#f8f9fa; }
      .card { background:white; padding:1.5rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.08); max-width:900px; margin:auto; }
      input[type="text"] { padding:0.5rem; width:120px; }
      .row { display:flex; gap:1rem; align-items:center; margin-bottom:1rem; }
      button { padding:0.6rem 1rem; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Olivetti Faces - Prediction Demo</h1>
      <p>Either enter an index (0–399) from the Olivetti dataset or upload an image (it will be converted to 64×64 grayscale).</p>

      <form method="post" action="/predict" enctype="multipart/form-data">
        <div class="row">
          <label for="index">Enter index (0–399):</label>
          <input type="text" id="index" name="index" placeholder="e.g. 18" />
          <button type="submit">Predict from index</button>
        </div>

        <hr />

        <div class="row">
          <label for="image">Or upload an image:</label>
          <input type="file" id="image" name="image" accept="image/*" />
          <button type="submit">Predict from upload</button>
        </div>
      </form>

      <hr/>
      <p style="font-size:0.9rem; color:#666;">Model: DecisionTreeClassifier on Olivetti faces | Author: G24AI2080</p>
    </div>
  </body>
</html>
